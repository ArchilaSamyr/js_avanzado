<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Animación con Canvas</title>
</head>
<body>

    <h2>Pelota en movimiento</h2>

    <canvas id="miCanvas" width="400" height="200"
    style="border:1px solid black;"></canvas>

    <script>
        const canvas = document.getElementById("miCanvas");
        const ctx = canvas.getContext("2d");

        let x = 30;
        let velocidad = 2;

        function animar() {
            ctx.clearRect(0, 0, 400, 200);

            ctx.beginPath();
            ctx.arc(x, 100, 20, 0, Math.PI * 2);
            ctx.fillStyle = "blue";
            ctx.fill();

            x = x + velocidad;

            if (x >= 380 || x <= 20) {
                velocidad = -velocidad;
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>

</body>
</html>
